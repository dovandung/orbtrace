name: build

on:
  push:
  pull_request:

jobs:
  orbtrace_mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive 
      - run: git fetch --prune --unshallow --no-recurse-submodules
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated API requests avoid the shared-runner rate limit.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # LiteX 2023.12 doesn't work on Python 3.13+, so pin 3.11 (after oss-cad-suite, which ships its own python).
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - uses: gregdavill/setup-riscv-gnu-toolchain@v2.0
        env:
          # Without a token the action passes curl an empty argument and fails.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ${{ steps.python.outputs.python-path }} -m pip install pdm meson ninja
      - run: pdm use -f ${{ steps.python.outputs.python-path }}
      - run: pdm install
      - run: pdm run orbtrace_builder --platform orbtrace_mini --build
      - uses: actions/upload-artifact@v4
        with:
          name: orbtrace_mini
          path: |
            build/orbtrace_mini/gateware/orbtrace_mini.bit
            build/orbtrace_mini/gateware/csr.csv

  orbtrace_mini_dfu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive 
      - run: git fetch --prune --unshallow --no-recurse-submodules
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated API requests avoid the shared-runner rate limit.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # LiteX 2023.12 doesn't work on Python 3.13+, so pin 3.11 (after oss-cad-suite, which ships its own python).
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - uses: gregdavill/setup-riscv-gnu-toolchain@v2.0
        env:
          # Without a token the action passes curl an empty argument and fails.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ${{ steps.python.outputs.python-path }} -m pip install pdm meson ninja
      - run: pdm use -f ${{ steps.python.outputs.python-path }}
      - run: pdm install
      - run: pdm run orbtrace_builder --platform orbtrace_mini --profile dfu --build 
      - uses: actions/upload-artifact@v4
        with:
          name: orbtrace_mini_dfu
          path: |
            build/orbtrace_mini_dfu/gateware/orbtrace_mini.bit
            build/orbtrace_mini_dfu/gateware/csr.csv
  
  orbtrace_mini_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive 
      - run: git fetch --prune --unshallow --no-recurse-submodules
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated API requests avoid the shared-runner rate limit.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # LiteX 2023.12 doesn't work on Python 3.13+, so pin 3.11 (after oss-cad-suite, which ships its own python).
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - uses: gregdavill/setup-riscv-gnu-toolchain@v2.0
        env:
          # Without a token the action passes curl an empty argument and fails.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ${{ steps.python.outputs.python-path }} -m pip install pdm meson ninja
      - run: pdm use -f ${{ steps.python.outputs.python-path }}
      - run: pdm install
      - run: pdm run orbtrace_builder --platform orbtrace_mini --profile test --build 
      - uses: actions/upload-artifact@v4
        with:
          name: orbtrace_mini_test
          path: |
            build/orbtrace_mini_test/gateware/orbtrace_mini.bit
            build/orbtrace_mini_test/gateware/csr.csv

  cynthion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ['25F', '12F']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git fetch --prune --unshallow --no-recurse-submodules
      # Release tags give the USB device version; forks may not have them.
      - run: git fetch --tags https://github.com/orbcode/orbtrace || true
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated API requests avoid the shared-runner rate limit.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # LiteX 2023.12 doesn't work on Python 3.13+, so pin 3.11 (after oss-cad-suite, which ships its own python).
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - uses: gregdavill/setup-riscv-gnu-toolchain@v2.0
        env:
          # Without a token the action passes curl an empty argument and fails.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ${{ steps.python.outputs.python-path }} -m pip install pdm meson ninja
      - run: pdm use -f ${{ steps.python.outputs.python-path }}
      - run: pdm install
      - run: |
          pdm run orbtrace_builder --platform cynthion --device ${{ matrix.device }} \
            --output-dir build/cynthion_${{ matrix.device }} --build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Timing summary
        if: always()
        run: |
          {
            echo "### Cynthion ${{ matrix.device }}"
            echo '```'
            grep -E "Max frequency for clock|Info: Device utilisation|TRELLIS_SLICE|TRELLIS_IO|DP16KD|EHXPLLL" build.log || echo "no nextpnr report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbtrace_cynthion_${{ matrix.device }}
          path: |
            build/cynthion_${{ matrix.device }}/gateware/cynthion.bit
            build/cynthion_${{ matrix.device }}/gateware/csr.csv
            build.log

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git fetch --prune --unshallow --no-recurse-submodules
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated API requests avoid the shared-runner rate limit.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # LiteX 2023.12 doesn't work on Python 3.13+, so pin 3.11 (after oss-cad-suite, which ships its own python).
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - run: ${{ steps.python.outputs.python-path }} -m pip install pdm
      - run: pdm use -f ${{ steps.python.outputs.python-path }}
      - run: pdm install -dG test
      - run: pdm test
